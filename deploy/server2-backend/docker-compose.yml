services:
  backend:
    image: ghcr.io/rzmy7/reviewmate-backend:latest
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    expose:
      - "8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - rabbitmq
      - redis
    networks:
      - backend-net

  # 🗄️ Redis Cache (review lists + AI summaries; internal-only)
  # Note: backend reads REDIS_URL from env_file (.env) — add
  # REDIS_URL=redis://redis:6379/0 there to enable caching.
  redis:
    image: redis:7-alpine
    container_name: reviewmate-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - backend-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: reviewmate-rabbitmq
    restart: unless-stopped
    ports:
      # Expose rabbitmq port 5672 to the public internet/local network for server4-scraper to connect
      - "5672:5672"
      # Expose 15672 for RabbitMQ Admin Panel (optional, keep behind firewall in production)
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - rabbitmq
    networks:
      - backend-net

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  backend-net:
    driver: bridge

volumes:
  certbot_www:
  certbot_conf:
  rabbitmq_data:
  redis_data:

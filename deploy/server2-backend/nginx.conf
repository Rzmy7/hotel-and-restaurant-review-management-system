# Conditional Connection header: only set to "upgrade" when the client
# sends an Upgrade header (i.e. WebSocket handshake). For regular HTTP
# requests $connection_upgrade evaluates to "" so the header is omitted.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api.reviewmate.live;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.reviewmate.live;

    ssl_certificate     /etc/letsencrypt/live/api.reviewmate.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.reviewmate.live/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Keep WebSocket connections alive for up to 5 minutes of idle time
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

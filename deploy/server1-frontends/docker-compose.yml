services:
  frontend:
    image: ghcr.io/rzmy7/reviewmate-frontend:latest
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:80/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend-net

  admin-frontend:
    image: ghcr.io/rzmy7/reviewmate-admin-frontend:latest
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_healthy
      admin-frontend:
        condition: service_healthy
    networks:
      - frontend-net

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  frontend-net:
    driver: bridge

volumes:
  certbot_www:
    external: true
    name: reviewmate_certbot_www
  certbot_conf:
    external: true
    name: reviewmate_certbot_conf

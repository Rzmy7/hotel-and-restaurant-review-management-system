services:
  frontend:
    image: ghcr.io/rzmy7/reviewmate-frontend:latest
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - frontend-net

  admin-frontend:
    image: ghcr.io/rzmy7/reviewmate-admin-frontend:latest
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - frontend-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment after setting up SSL certificates:
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - admin-frontend
    networks:
      - frontend-net

networks:
  frontend-net:
    driver: bridge

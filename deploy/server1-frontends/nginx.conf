worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Use Docker's internal DNS resolver so nginx resolves hostnames at
    # request-time instead of startup-time. This prevents "host not found
    # in upstream" crashes when containers restart or aren't ready yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── HTTP → HTTPS redirect + ACME challenge ─────────────────────
    server {
        listen 80;
        server_name reviewmate.live admin.reviewmate.live;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main Frontend (HTTPS) ──────────────────────────────────────
    server {
        listen 443 ssl;
        server_name reviewmate.live;

        ssl_certificate     /etc/letsencrypt/live/reviewmate.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/reviewmate.live/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            # Use a variable so nginx resolves at request-time, not startup
            set $upstream_frontend http://frontend:80;
            proxy_pass $upstream_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── Admin Frontend (HTTPS) ─────────────────────────────────────
    server {
        listen 443 ssl;
        server_name admin.reviewmate.live;

        ssl_certificate     /etc/letsencrypt/live/reviewmate.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/reviewmate.live/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            # Use a variable so nginx resolves at request-time, not startup
            set $upstream_admin http://admin-frontend:80;
            proxy_pass $upstream_admin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── Fallback: reject unmatched HTTPS requests ─────────────────
    # Without this, unmatched 443 requests go to the first server block,
    # which can cause admin.reviewmate.live to serve the user panel or
    # vice versa.
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/reviewmate.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/reviewmate.live/privkey.pem;

        # Drop the connection for unknown hostnames
        return 444;
    }

    # ── Fallback (IP / direct access on port 80) ──────────────────
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            set $upstream_frontend_fallback http://frontend:80;
            proxy_pass $upstream_frontend_fallback;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

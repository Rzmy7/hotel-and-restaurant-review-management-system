worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # ── HTTP → HTTPS redirect + ACME challenge ─────────────────────
    server {
        listen 80;
        server_name reviewmate.live admin.reviewmate.live;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main Frontend (HTTPS) ──────────────────────────────────────
    server {
        listen 443 ssl;
        server_name reviewmate.live;

        ssl_certificate     /etc/letsencrypt/live/reviewmate.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/reviewmate.live/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── Admin Frontend (HTTPS) ─────────────────────────────────────
    server {
        listen 443 ssl;
        server_name admin.reviewmate.live;

        ssl_certificate     /etc/letsencrypt/live/reviewmate.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/reviewmate.live/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://admin-frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── Fallback (IP access) ──────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    client_max_body_size 100M; # Support large PDF/Doc uploads

    # Gzip compression for performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Conditional Connection header (for WebSockets)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker DNS resolver (resolves service names at runtime)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── HTTP to HTTPS Redirect + Certbot Challenge ──
    server {
        listen 80;
        server_name reviewmate.live admin.reviewmate.live api.reviewmate.live embed.reviewmate.live scrape.reviewmate.live;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── User Frontend (reviewmate.live) ──
    server {
        listen 443 ssl;
        server_name reviewmate.live;
        ssl_certificate /etc/letsencrypt/live/reviewmate.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/reviewmate.live/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            set $upstream_frontend http://frontend:80;
            proxy_pass $upstream_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── Admin Frontend (admin.reviewmate.live) ──
    server {
        listen 443 ssl;
        server_name admin.reviewmate.live;
        ssl_certificate /etc/letsencrypt/live/reviewmate.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/reviewmate.live/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            set $upstream_admin_frontend http://admin-frontend:80;
            proxy_pass $upstream_admin_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── Backend API (api.reviewmate.live) ──
    server {
        listen 443 ssl;
        server_name api.reviewmate.live;
        ssl_certificate /etc/letsencrypt/live/reviewmate.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/reviewmate.live/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            set $upstream_backend http://backend:8000;
            proxy_pass $upstream_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (for live sync progress updates)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    # ── Embedding API (embed.reviewmate.live) ──
    server {
        listen 443 ssl;
        server_name embed.reviewmate.live;
        ssl_certificate /etc/letsencrypt/live/reviewmate.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/reviewmate.live/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            set $upstream_embedding http://embedding:8002;
            proxy_pass $upstream_embedding;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── Scraper API (scrape.reviewmate.live) ──
    server {
        listen 443 ssl;
        server_name scrape.reviewmate.live;
        ssl_certificate /etc/letsencrypt/live/reviewmate.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/reviewmate.live/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            set $upstream_scraper http://scraper:8001;
            proxy_pass $upstream_scraper;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket and timeout support (for scraper logs/relay)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
        }
    }
}

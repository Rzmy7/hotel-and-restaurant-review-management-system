version: '3.8'

# ═══════════════════════════════════════════════════════════════════
# Single VPS Docker Compose — External Database
# ═══════════════════════════════════════════════════════════════════
# Usage:
#   1. Copy deploy/single-vps/.env.example to project root as .env
#   2. Copy this file to project root as docker-compose.yml
#   3. Run: docker compose up -d --build
# ═══════════════════════════════════════════════════════════════════

services:
  # 🧠 Embedding Service (ChromaDB + SentenceTransformers)
  embedding:
    image: ghcr.io/rzmy7/reviewmate-embedding:latest
    build:
      context: ./microservices/embedding-service
    container_name: reviewmate-embedding
    restart: unless-stopped
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - EMBEDDING_API_KEYS=${INTERNAL_API_KEY}
      - ADMIN_FRONTEND_URL=https://admin.${DOMAIN_NAME:-reviewmate.live}
      - PORT=8002
      - PROD_MODE=true
    # Note: Ports are internal-only for security; exposed via Nginx
    volumes:
      - chroma_data:/app/chroma_data

  # 🕷️ Scraper Engine (Playwright + FastAPI)
  scraper:
    image: ghcr.io/rzmy7/reviewmate-scraper:latest
    build:
      context: ./microservices/scraper_engine
    container_name: reviewmate-scraper
    restart: unless-stopped
    shm_size: '2gb' # Playwright requires shared memory to prevent browser crashes
    # Note: Ports are internal-only for security; exposed via Nginx
    depends_on:
      - backend
      - rabbitmq
    environment:
      - DB_DRIVER=ODBC Driver 18 for SQL Server
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=ScraperEngine
      - DB_UID=${DB_UID}
      - DB_PWD=${DB_PWD}
      - DB_ENCRYPT=${DB_ENCRYPT:-yes}
      - DB_TRUST_CERT=yes
      - BACKEND_API_URL=http://backend:8000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - SCRAPER_API_KEYS=${INTERNAL_API_KEY}
      - BACKEND_API_KEY=${INTERNAL_API_KEY}
      - PROD_MODE=true
      - MAX_QUEUE_SIZE=${MAX_QUEUE_SIZE:-100}
      - RATE_LIMIT_SCRAPE=${RATE_LIMIT_SCRAPE:-10/minute}
      - RATE_LIMIT_GLOBAL=${RATE_LIMIT_GLOBAL:-100/minute}
      - DELAY_GOOGLE=${DELAY_GOOGLE:-30.0}
      - DELAY_AGODA=${DELAY_AGODA:-20.0}
      - DELAY_BOOKING=${DELAY_BOOKING:-20.0}
      - DELAY_TRIPADVISOR=${DELAY_TRIPADVISOR:-40.0}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/}

  # ⚙️ Backend API (FastAPI)
  backend:
    image: ghcr.io/rzmy7/reviewmate-backend:latest
    build:
      context: ./backend
    container_name: reviewmate-backend
    restart: unless-stopped
    # Note: Ports are internal-only for security; exposed via Nginx
    depends_on:
      - rabbitmq
    volumes:
      # scripts/ is excluded by .dockerignore — mount it for db_rebuild.py
      - ./backend/scripts:/app/scripts:ro
    environment:
      # ── General ──
      - SECRET_KEY=${SECRET_KEY}
      - FRONTEND_URL=https://${DOMAIN_NAME:-reviewmate.live}
      - ADMIN_FRONTEND_URL=https://admin.${DOMAIN_NAME:-reviewmate.live}
      - PROD_MODE=true
      # ── Database (SQLAlchemy — auth/users/groups) ──
      - DATABASE_URL=mssql+pyodbc://${DB_UID}:${DB_PWD}@${DB_SERVER}:${DB_PORT:-1433}/${DB_NAME}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes&Encrypt=${DB_ENCRYPT:-yes}
      # ── Database (PyODBC — reviews/dashboard/analytics) ──
      - DB_DRIVER=ODBC Driver 18 for SQL Server
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - DB_UID=${DB_UID}
      - DB_PWD=${DB_PWD}
      - DB_ENCRYPT=${DB_ENCRYPT:-yes}
      # ── AI / LLM ──
      - LLM_ENCRYPTION_KEY=${LLM_ENCRYPTION_KEY}
      # ── JWT ──
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # ── SMTP (Notifications & password resets) ──
      - SMTP_EMAIL=${SMTP_EMAIL}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_TIMEOUT=${SMTP_TIMEOUT:-10}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      # ── Google OAuth ──
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # ── Supabase (File storage) ──
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET}
      # ── Microservice URLs (Docker service names, NOT localhost) ──
      - SCRAPER_ENGINE_URL=http://scraper:8001
      - EMBEDDING_SERVICE_URL=http://embedding:8002
      # ── Service-to-Service Authentication ──
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - SCRAPER_API_KEY=${INTERNAL_API_KEY}
      - EMBEDDING_API_KEY=${INTERNAL_API_KEY}
      - BACKEND_API_KEYS=${INTERNAL_API_KEY}
      # ── CORS (allowed frontend origins) ──
      - CORS_ORIGINS=https://${DOMAIN_NAME:-reviewmate.live},https://admin.${DOMAIN_NAME:-reviewmate.live}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/}

  # 🐇 Message Broker (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: reviewmate-rabbitmq
    restart: unless-stopped
    ports:
      # Expose rabbitmq ports (5672 for amqp, 15672 for admin management dashboard)
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # 💻 User Frontend (React + Vite)
  frontend:
    image: ghcr.io/rzmy7/reviewmate-frontend:latest
    build:
      context: ./frontend
      args:
        # Build-time args baked into the static JS bundle (resolve in browser)
        - VITE_MAIN_BACKEND_URL=https://api.${DOMAIN_NAME:-reviewmate.live}
        - VITE_ADMIN_PANEL_URL=https://admin.${DOMAIN_NAME:-reviewmate.live}
    container_name: reviewmate-frontend
    restart: unless-stopped
    # Note: Ports are internal-only for security; exposed via Nginx
    depends_on:
      - backend

  # 🎛️ Admin Frontend (React + Vite)
  admin-frontend:
    image: ghcr.io/rzmy7/reviewmate-admin-frontend:latest
    build:
      context: ./admin-frontend
      args:
        # Build-time args baked into the static JS bundle (resolve in browser)
        - VITE_MAIN_BACKEND_URL=https://api.${DOMAIN_NAME:-reviewmate.live}
        - VITE_SCRAPING_URL=https://scrape.${DOMAIN_NAME:-reviewmate.live}
        - VITE_EMBEDDING_SERVICE_URL=https://embed.${DOMAIN_NAME:-reviewmate.live}
        - VITE_FRONTEND_URL=https://${DOMAIN_NAME:-reviewmate.live}
    container_name: reviewmate-admin-frontend
    restart: unless-stopped
    # Note: Ports are internal-only for security; exposed via Nginx
    depends_on:
      - backend

  # 🌐 Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: reviewmate-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/single-vps/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - frontend
      - admin-frontend
      - backend
      - scraper
      - embedding
      - rabbitmq

  # 🔒 Certbot (SSL Auto-renewal)
  certbot:
    image: certbot/certbot:v2.8.0
    container_name: reviewmate-certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  chroma_data:
  rabbitmq_data:
  certbot_conf:
  certbot_www:

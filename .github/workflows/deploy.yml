#           rm -rf /tmp/pip-* /tmp/npm-* || true

  # ═══════════════════════════════════════════════════════════════════
  # BUILD JOBS — only run AFTER tests pass for each component
  # ═══════════════════════════════════════════════════════════════════

  build-frontend:
    needs: [detect-changes]
    if: |
      always() &&
      needs.detect-changes.outputs.frontend == 'true'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fix workspace permissions
        run: docker run --rm -v "${{ github.workspace }}:/workspace" alpine sh -c "chown -R $(id -u):$(id -g) /workspace" || true
      - uses: actions/checkout@v4
        with:
          clean: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.PROD_API_URL }}
            VITE_MAIN_BACKEND_URL=${{ vars.PROD_API_URL }}
            VITE_ADMIN_PANEL_URL=${{ vars.PROD_ADMIN_URL }}

  build-admin-frontend:
    needs: [detect-changes]
    if: |
      always() &&
      needs.detect-changes.outputs['admin-frontend'] == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fix workspace permissions
        run: docker run --rm -v "${{ github.workspace }}:/workspace" alpine sh -c "chown -R $(id -u):$(id -g) /workspace" || true
      - uses: actions/checkout@v4
        with:
          clean: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./admin-frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-admin-frontend:latest
            ${{ env.IMAGE_PREFIX }}-admin-frontend:${{ github.sha }}
          build-args: |
            VITE_MAIN_BACKEND_URL=${{ vars.PROD_API_URL }}
            VITE_SCRAPING_URL=${{ vars.PROD_SCRAPER_URL }}
            VITE_EMBEDDING_SERVICE_URL=${{ vars.PROD_EMBEDDING_URL }}
            VITE_FRONTEND_URL=${{ vars.PROD_FRONTEND_URL }}
            VITE_INTERNAL_API_KEY=${{ secrets.INTERNAL_API_KEY }}

  build-backend:
    needs: [detect-changes]
    if: |
      always() &&
      needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fix workspace permissions
        run: docker run --rm -v "${{ github.workspace }}:/workspace" alpine sh -c "chown -R $(id -u):$(id -g) /workspace" || true
      - uses: actions/checkout@v4
        with:
          clean: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

  build-embedding:
    needs: [detect-changes]
    if: |
      always() &&
      needs.detect-changes.outputs.embedding == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fix workspace permissions
        run: docker run --rm -v "${{ github.workspace }}:/workspace" alpine sh -c "chown -R $(id -u):$(id -g) /workspace" || true
      - uses: actions/checkout@v4
        with:
          clean: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./microservices/embedding-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-embedding:latest
            ${{ env.IMAGE_PREFIX }}-embedding:${{ github.sha }}

  build-scraper:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.scraper == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fix workspace permissions
        run: docker run --rm -v "${{ github.workspace }}:/workspace" alpine sh -c "chown -R $(id -u):$(id -g) /workspace" || true
      - uses: actions/checkout@v4
        with:
          clean: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./microservices/scraper_engine
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-scraper:latest
            ${{ env.IMAGE_PREFIX }}-scraper:${{ github.sha }}

  # ═══════════════════════════════════════════════════════════════════
  # DEPLOY JOBS — sync configs, bootstrap SSL if needed, start stack
  # ═══════════════════════════════════════════════════════════════════

  deploy:
    needs: [detect-changes, build-frontend, build-admin-frontend, build-backend, build-embedding, build-scraper]
    if: |
      always() &&
      (
        needs.build-frontend.result == 'success' ||
        needs.build-admin-frontend.result == 'success' ||
        needs.build-backend.result == 'success' ||
        needs.build-embedding.result == 'success' ||
        needs.build-scraper.result == 'success' ||
        needs.detect-changes.outputs.deploy-frontends == 'true' ||
        needs.detect-changes.outputs.deploy-backend == 'true' ||
        needs.detect-changes.outputs.deploy-embedding == 'true' ||
        needs.detect-changes.outputs.deploy-scraper == 'true'
      ) &&
      !(
        needs.build-frontend.result == 'failure' ||
        needs.build-admin-frontend.result == 'failure' ||
        needs.build-backend.result == 'failure' ||
        needs.build-embedding.result == 'failure' ||
        needs.build-scraper.result == 'failure'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SINGLE_VPS_HOST || secrets.FRONTEND_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 5m
          envs: RAW_BASE,GHCR_TOKEN
          script: |
            mkdir -p /opt/reviewmate/deploy/single-vps/nginx
            cd /opt/reviewmate
            
            # Sync config files from repo (auth required for private repos)
            curl -sfL -H "Authorization: token $GHCR_TOKEN" "$RAW_BASE/deploy/single-vps/docker-compose.yml" -o docker-compose.yml.tmp && mv docker-compose.yml.tmp docker-compose.yml
            curl -sfL -H "Authorization: token $GHCR_TOKEN" "$RAW_BASE/deploy/single-vps/nginx/nginx.conf" -o deploy/single-vps/nginx/nginx.conf.tmp && mv deploy/single-vps/nginx/nginx.conf.tmp deploy/single-vps/nginx/nginx.conf
            curl -sfL -H "Authorization: token $GHCR_TOKEN" "$RAW_BASE/deploy/single-vps/init-ssl.sh" -o init-ssl.sh.tmp && mv init-ssl.sh.tmp init-ssl.sh
            chmod +x init-ssl.sh
            
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            
            # Bootstrap SSL if certs don't exist (must run BEFORE docker compose up)
            # The volume name created by docker compose is reviewmate_certbot_conf (directory name prefixed)
            CERT_EXISTS=$(docker run --rm -v reviewmate_certbot_conf:/etc/letsencrypt alpine test -f /etc/letsencrypt/live/reviewmate.live/fullchain.pem && echo "yes" || echo "no")
            if [ "$CERT_EXISTS" = "no" ]; then
              echo "SSL certs not found, running init-ssl.sh..."
              bash init-ssl.sh
            else
              docker compose up -d --remove-orphans
            fi
            docker image prune -f
            echo "Single VPS stack deployed successfully"


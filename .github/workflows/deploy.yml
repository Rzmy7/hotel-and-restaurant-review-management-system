name: Build & Deploy

on:
  push:
    branches: [dev]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/rzmy7/reviewmate

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # CHANGE DETECTION — figure out what actually changed
  # ═══════════════════════════════════════════════════════════════════

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      admin-frontend: ${{ steps.filter.outputs.admin-frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      embedding: ${{ steps.filter.outputs.embedding }}
      scraper: ${{ steps.filter.outputs.scraper }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'deploy/server1-frontends/**'
            admin-frontend:
              - 'admin-frontend/**'
              - 'deploy/server1-frontends/**'
            backend:
              - 'backend/**'
              - 'deploy/server2-backend/**'
            embedding:
              - 'microservices/embedding-service/**'
              - 'deploy/server3-embedding/**'
            scraper:
              - 'microservices/scraper_engine/**'
              - 'deploy/server4-scraper/**'

  # ═══════════════════════════════════════════════════════════════════
  # BUILD JOBS — only run when their code changes
  # ═══════════════════════════════════════════════════════════════════

  build-frontend:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.PROD_API_URL }}
            VITE_MAIN_BACKEND_URL=${{ vars.PROD_API_URL }}
            VITE_ADMIN_PANEL_URL=${{ vars.PROD_ADMIN_URL }}

  build-admin-frontend:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.admin-frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./admin-frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-admin-frontend:latest
            ${{ env.IMAGE_PREFIX }}-admin-frontend:${{ github.sha }}
          build-args: |
            VITE_MAIN_BACKEND_URL=${{ vars.PROD_API_URL }}
            VITE_SCRAPING_URL=${{ vars.PROD_SCRAPER_URL }}
            VITE_EMBEDDING_SERVICE_URL=${{ vars.PROD_EMBEDDING_URL }}
            VITE_FRONTEND_URL=${{ vars.PROD_FRONTEND_URL }}

  build-backend:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

  build-embedding:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.embedding == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./microservices/embedding-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-embedding:latest
            ${{ env.IMAGE_PREFIX }}-embedding:${{ github.sha }}

  build-scraper:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.scraper == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./microservices/scraper_engine
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-scraper:latest
            ${{ env.IMAGE_PREFIX }}-scraper:${{ github.sha }}

  # ═══════════════════════════════════════════════════════════════════
  # DEPLOY JOBS — only run when their respective build ran
  # ═══════════════════════════════════════════════════════════════════

  deploy-frontends:
    needs: [detect-changes, build-frontend, build-admin-frontend]
    if: |
      always() &&
      (needs.build-frontend.result == 'success' || needs.build-admin-frontend.result == 'success') &&
      !(needs.build-frontend.result == 'failure' || needs.build-admin-frontend.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync config files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/server1-frontends/docker-compose.yml,deploy/server1-frontends/nginx.conf,deploy/server1-frontends/init-ssl.sh"
          target: /opt/reviewmate
          strip_components: 2

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/reviewmate
            chmod +x init-ssl.sh
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            # Auto-bootstrap SSL if certs don't exist yet
            if [ ! -d "/etc/letsencrypt/live/reviewmate.live" ] && [ ! -f "/var/lib/docker/volumes/reviewmate_certbot_conf/_data/live/reviewmate.live/fullchain.pem" ]; then
              echo "SSL certs not found, running init-ssl.sh..."
              bash init-ssl.sh
            fi
            echo "Frontends deployed successfully"

  deploy-backend:
    needs: [build-backend]
    if: needs.build-backend.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync config files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/server2-backend/docker-compose.yml,deploy/server2-backend/nginx.conf,deploy/server2-backend/init-ssl.sh"
          target: /opt/reviewmate
          strip_components: 2

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/reviewmate
            chmod +x init-ssl.sh
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            if ! docker volume inspect reviewmate-backend_certbot_conf >/dev/null 2>&1 || [ -z "$(docker run --rm -v reviewmate-backend_certbot_conf:/etc/letsencrypt alpine ls /etc/letsencrypt/live/ 2>/dev/null)" ]; then
              echo "SSL certs not found, running init-ssl.sh..."
              bash init-ssl.sh
            fi
            echo "Backend deployed successfully"

  deploy-embedding:
    needs: [build-embedding]
    if: needs.build-embedding.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync config files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EMBEDDING_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/server3-embedding/docker-compose.yml,deploy/server3-embedding/nginx.conf,deploy/server3-embedding/init-ssl.sh"
          target: /opt/reviewmate
          strip_components: 2

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EMBEDDING_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/reviewmate
            chmod +x init-ssl.sh
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            if ! docker volume inspect reviewmate-embedding_certbot_conf >/dev/null 2>&1 || [ -z "$(docker run --rm -v reviewmate-embedding_certbot_conf:/etc/letsencrypt alpine ls /etc/letsencrypt/live/ 2>/dev/null)" ]; then
              echo "SSL certs not found, running init-ssl.sh..."
              bash init-ssl.sh
            fi
            echo "Embedding service deployed successfully"

  deploy-scraper:
    needs: [build-scraper]
    if: needs.build-scraper.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync config files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SCRAPING_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/server4-scraper/docker-compose.yml,deploy/server4-scraper/nginx.conf,deploy/server4-scraper/init-ssl.sh"
          target: /opt/reviewmate
          strip_components: 2

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SCRAPING_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/reviewmate
            chmod +x init-ssl.sh
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            if ! docker volume inspect reviewmate-scraper_certbot_conf >/dev/null 2>&1 || [ -z "$(docker run --rm -v reviewmate-scraper_certbot_conf:/etc/letsencrypt alpine ls /etc/letsencrypt/live/ 2>/dev/null)" ]; then
              echo "SSL certs not found, running init-ssl.sh..."
              bash init-ssl.sh
            fi
            echo "Scraper engine deployed successfully"


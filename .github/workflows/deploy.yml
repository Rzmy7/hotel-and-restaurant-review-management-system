name: Build & Deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Force deploy everything'
        required: false
        type: boolean
        default: false
      deploy_frontends:
        description: 'Force deploy frontends (user + admin)'
        required: false
        type: boolean
        default: false
      deploy_backend:
        description: 'Force deploy backend'
        required: false
        type: boolean
        default: false
      deploy_embedding:
        description: 'Force deploy embedding service'
        required: false
        type: boolean
        default: false
      deploy_scraper:
        description: 'Force deploy scraper engine'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/rzmy7/reviewmate
  RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # CHANGE DETECTION — figure out what actually changed
  # ═══════════════════════════════════════════════════════════════════

  detect-changes:
    runs-on: self-hosted
    outputs:
      frontend: ${{ steps.check.outputs.frontend }}
      admin-frontend: ${{ steps.check.outputs.admin-frontend }}
      backend: ${{ steps.check.outputs.backend }}
      embedding: ${{ steps.check.outputs.embedding }}
      scraper: ${{ steps.check.outputs.scraper }}
      deploy-frontends: ${{ steps.check.outputs.deploy-frontends }}
      deploy-backend: ${{ steps.check.outputs.deploy-backend }}
      deploy-embedding: ${{ steps.check.outputs.deploy-embedding }}
      deploy-scraper: ${{ steps.check.outputs.deploy-scraper }}
    steps:
      - name: Fix workspace permissions
        run: docker run --rm -v "${{ github.workspace }}:/workspace" alpine sh -c "chown -R $(id -u):$(id -g) /workspace" || true
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 2

      - name: Detect changed paths
        id: check
        run: |
          # Force deploy everything
          if [ "${{ github.event.inputs.deploy_all }}" == "true" ]; then
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "admin-frontend=true" >> $GITHUB_OUTPUT
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "embedding=true" >> $GITHUB_OUTPUT
            echo "scraper=true" >> $GITHUB_OUTPUT
            echo "deploy-frontends=true" >> $GITHUB_OUTPUT
            echo "deploy-backend=true" >> $GITHUB_OUTPUT
            echo "deploy-embedding=true" >> $GITHUB_OUTPUT
            echo "deploy-scraper=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Per-component force deploy overrides
          FORCE_FRONTENDS="${{ github.event.inputs.deploy_frontends }}"
          FORCE_BACKEND="${{ github.event.inputs.deploy_backend }}"
          FORCE_EMBEDDING="${{ github.event.inputs.deploy_embedding }}"
          FORCE_SCRAPER="${{ github.event.inputs.deploy_scraper }}"

          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          check_path() {
            local name=$1
            local pattern=$2
            if echo "$CHANGED" | grep -q "^${pattern}"; then
              echo "${name}=true" >> $GITHUB_OUTPUT
            else
              echo "${name}=false" >> $GITHUB_OUTPUT
            fi
          }

          # Frontends — use force override or detect from diff
          if [ "$FORCE_FRONTENDS" == "true" ]; then
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "admin-frontend=true" >> $GITHUB_OUTPUT
            echo "deploy-frontends=true" >> $GITHUB_OUTPUT
          else
            check_path "frontend" "frontend/"
            check_path "admin-frontend" "admin-frontend/"
            check_path "deploy-frontends" "deploy/server1-frontends/"
          fi

          # Backend
          if [ "$FORCE_BACKEND" == "true" ]; then
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "deploy-backend=true" >> $GITHUB_OUTPUT
          else
            check_path "backend" "backend/"
            check_path "deploy-backend" "deploy/server2-backend/"
          fi

          # Embedding service
          if [ "$FORCE_EMBEDDING" == "true" ]; then
            echo "embedding=true" >> $GITHUB_OUTPUT
            echo "deploy-embedding=true" >> $GITHUB_OUTPUT
          else
            check_path "embedding" "microservices/embedding-service/"
            check_path "deploy-embedding" "deploy/server3-embedding/"
          fi

          # Scraper engine
          if [ "$FORCE_SCRAPER" == "true" ]; then
            echo "scraper=true" >> $GITHUB_OUTPUT
            echo "deploy-scraper=true" >> $GITHUB_OUTPUT
          else
            check_path "scraper" "microservices/scraper_engine/"
            check_path "deploy-scraper" "deploy/server4-scraper/"
          fi

  # ═══════════════════════════════════════════════════════════════════
  # TEST GATES — run tests before building (only for changed components)
  # ═══════════════════════════════════════════════════════════════════

  test-backend:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Fix workspace permissions
        working-directory: ${{ github.workspace }}
        run: docker run --rm -v "${{ github.workspace }}:/workspace" alpine sh -c "chown -R $(id -u):$(id -g) /workspace" || true
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run backend tests (328 tests)
        run: python -m pytest tests/unit/ tests/integration/ tests/schema_validation/ -v --tb=short

      - name: Cleanup disk
        if: always()
        run: |
          pip cache purge || true
          docker image prune -af || true
          docker builder prune -af || true
          rm -rf ${{ github.workspace }}/.pytest_cache || true
          rm -rf /tmp/pip-* /tmp/npm-* || true

  test-frontend:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Fix workspace permissions
        working-directory: ${{ github.workspace }}
        run: docker run --rm -v "${{ github.workspace }}:/workspace" alpine sh -c "chown -R $(id -u):$(id -g) /workspace" || true
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests (175 tests)
        run: npx vitest run --reporter=verbose

      - name: Cleanup disk
        if: always()
        run: |
          npm cache clean --force || true
          docker image prune -af || true
          docker builder prune -af || true
          rm -rf /tmp/npm-* || true

  test-admin-frontend:
    needs: [detect-changes]
    if: needs.detect-changes.outputs['admin-frontend'] == 'true'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: admin-frontend
    steps:
      - name: Fix workspace permissions
        working-directory: ${{ github.workspace }}
        run: docker run --rm -v "${{ github.workspace }}:/workspace" alpine sh -c "chown -R $(id -u):$(id -g) /workspace" || true
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run admin frontend tests (79 tests)
        run: npx vitest run --reporter=verbose

      - name: Cleanup disk
        if: always()
        run: |
          npm cache clean --force || true
          docker image prune -af || true
          docker builder prune -af || true
          rm -rf /tmp/npm-* || true

  test-embedding:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.embedding == 'true'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: microservices/embedding-service
    steps:
      - name: Fix workspace permissions
        working-directory: ${{ github.workspace }}
        run: docker run --rm -v "${{ github.workspace }}:/workspace" alpine sh -c "chown -R $(id -u):$(id -g) /workspace" || true
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: microservices/embedding-service/requirements.txt

      - name: Free disk space
        run: |
          pip cache purge || true
          docker image prune -af || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest httpx

      - name: Run embedding service tests (142 tests)
        run: python -m pytest tests/ -v --tb=short

      - name: Cleanup disk
        if: always()
        run: |
          pip cache purge || true
          docker image prune -af || true
          docker builder prune -af || true
          rm -rf ${{ github.workspace }}/.pytest_cache || true
          rm -rf /tmp/pip-* /tmp/npm-* || true

  # ═══════════════════════════════════════════════════════════════════
  # BUILD JOBS — only run AFTER tests pass for each component
  # ═══════════════════════════════════════════════════════════════════

  build-frontend:
    needs: [detect-changes, test-frontend]
    if: |
      always() &&
      needs.detect-changes.outputs.frontend == 'true' &&
      needs.test-frontend.result != 'failure'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fix workspace permissions
        run: docker run --rm -v "${{ github.workspace }}:/workspace" alpine sh -c "chown -R $(id -u):$(id -g) /workspace" || true
      - uses: actions/checkout@v4
        with:
          clean: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.PROD_API_URL }}
            VITE_MAIN_BACKEND_URL=${{ vars.PROD_API_URL }}
            VITE_ADMIN_PANEL_URL=${{ vars.PROD_ADMIN_URL }}

  build-admin-frontend:
    needs: [detect-changes, test-admin-frontend]
    if: |
      always() &&
      needs.detect-changes.outputs['admin-frontend'] == 'true' &&
      needs.test-admin-frontend.result != 'failure'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fix workspace permissions
        run: docker run --rm -v "${{ github.workspace }}:/workspace" alpine sh -c "chown -R $(id -u):$(id -g) /workspace" || true
      - uses: actions/checkout@v4
        with:
          clean: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./admin-frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-admin-frontend:latest
            ${{ env.IMAGE_PREFIX }}-admin-frontend:${{ github.sha }}
          build-args: |
            VITE_MAIN_BACKEND_URL=${{ vars.PROD_API_URL }}
            VITE_SCRAPING_URL=${{ vars.PROD_SCRAPER_URL }}
            VITE_EMBEDDING_SERVICE_URL=${{ vars.PROD_EMBEDDING_URL }}
            VITE_FRONTEND_URL=${{ vars.PROD_FRONTEND_URL }}
            VITE_INTERNAL_API_KEY=${{ secrets.INTERNAL_API_KEY }}

  build-backend:
    needs: [detect-changes, test-backend]
    if: |
      always() &&
      needs.detect-changes.outputs.backend == 'true' &&
      needs.test-backend.result != 'failure'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fix workspace permissions
        run: docker run --rm -v "${{ github.workspace }}:/workspace" alpine sh -c "chown -R $(id -u):$(id -g) /workspace" || true
      - uses: actions/checkout@v4
        with:
          clean: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

  build-embedding:
    needs: [detect-changes, test-embedding]
    if: |
      always() &&
      needs.detect-changes.outputs.embedding == 'true' &&
      needs.test-embedding.result != 'failure'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fix workspace permissions
        run: docker run --rm -v "${{ github.workspace }}:/workspace" alpine sh -c "chown -R $(id -u):$(id -g) /workspace" || true
      - uses: actions/checkout@v4
        with:
          clean: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./microservices/embedding-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-embedding:latest
            ${{ env.IMAGE_PREFIX }}-embedding:${{ github.sha }}

  build-scraper:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.scraper == 'true'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fix workspace permissions
        run: docker run --rm -v "${{ github.workspace }}:/workspace" alpine sh -c "chown -R $(id -u):$(id -g) /workspace" || true
      - uses: actions/checkout@v4
        with:
          clean: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./microservices/scraper_engine
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-scraper:latest
            ${{ env.IMAGE_PREFIX }}-scraper:${{ github.sha }}

  # ═══════════════════════════════════════════════════════════════════
  # DEPLOY JOBS — sync configs, bootstrap SSL if needed, start stack
  # ═══════════════════════════════════════════════════════════════════

  deploy-frontends:
    needs: [detect-changes, build-frontend, build-admin-frontend]
    if: |
      always() &&
      (
        needs.build-frontend.result == 'success' ||
        needs.build-admin-frontend.result == 'success' ||
        needs.detect-changes.outputs['deploy-frontends'] == 'true'
      ) &&
      !(needs.build-frontend.result == 'failure' || needs.build-admin-frontend.result == 'failure')
    runs-on: self-hosted
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 5m
          envs: RAW_BASE,GHCR_TOKEN
          script: |
            cd /opt/reviewmate
            # Sync config files from repo (auth required for private repos)
            curl -sfL -H "Authorization: token $GHCR_TOKEN" "$RAW_BASE/deploy/server1-frontends/docker-compose.yml" -o docker-compose.yml.tmp && mv docker-compose.yml.tmp docker-compose.yml
            curl -sfL -H "Authorization: token $GHCR_TOKEN" "$RAW_BASE/deploy/server1-frontends/nginx.conf" -o nginx.conf.tmp && mv nginx.conf.tmp nginx.conf
            curl -sfL -H "Authorization: token $GHCR_TOKEN" "$RAW_BASE/deploy/server1-frontends/init-ssl.sh" -o init-ssl.sh.tmp && mv init-ssl.sh.tmp init-ssl.sh
            chmod +x init-ssl.sh
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            # Bootstrap SSL if certs don't exist (must run BEFORE docker compose up)
            CERT_EXISTS=$(docker run --rm -v reviewmate_certbot_conf:/etc/letsencrypt alpine test -f /etc/letsencrypt/live/reviewmate.live/fullchain.pem && echo "yes" || echo "no")
            if [ "$CERT_EXISTS" = "no" ]; then
              echo "SSL certs not found, running init-ssl.sh..."
              bash init-ssl.sh
            else
              docker compose up -d --remove-orphans
            fi
            docker image prune -f
            echo "Frontends deployed successfully"

  deploy-backend:
    needs: [detect-changes, build-backend]
    if: |
      always() &&
      (needs.build-backend.result == 'success' || needs.detect-changes.outputs['deploy-backend'] == 'true') &&
      needs.build-backend.result != 'failure'
    runs-on: self-hosted
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 5m
          envs: RAW_BASE,GHCR_TOKEN
          script: |
            cd /opt/reviewmate
            curl -sfL -H "Authorization: token $GHCR_TOKEN" "$RAW_BASE/deploy/server2-backend/docker-compose.yml" -o docker-compose.yml.tmp && mv docker-compose.yml.tmp docker-compose.yml
            curl -sfL -H "Authorization: token $GHCR_TOKEN" "$RAW_BASE/deploy/server2-backend/nginx.conf" -o nginx.conf.tmp && mv nginx.conf.tmp nginx.conf
            curl -sfL -H "Authorization: token $GHCR_TOKEN" "$RAW_BASE/deploy/server2-backend/init-ssl.sh" -o init-ssl.sh.tmp && mv init-ssl.sh.tmp init-ssl.sh
            chmod +x init-ssl.sh
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            CERT_EXISTS=$(docker run --rm -v reviewmate_certbot_conf:/etc/letsencrypt alpine test -f /etc/letsencrypt/live/api.reviewmate.live/fullchain.pem && echo "yes" || echo "no")
            if [ "$CERT_EXISTS" = "no" ]; then
              echo "SSL certs not found, running init-ssl.sh..."
              bash init-ssl.sh
            else
              docker compose up -d --remove-orphans
            fi
            docker image prune -f
            echo "Backend deployed successfully"

  deploy-embedding:
    needs: [detect-changes, build-embedding]
    if: |
      always() &&
      (needs.build-embedding.result == 'success' || needs.detect-changes.outputs['deploy-embedding'] == 'true') &&
      needs.build-embedding.result != 'failure'
    runs-on: self-hosted
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EMBEDDING_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 5m
          envs: RAW_BASE,GHCR_TOKEN
          script: |
            cd /opt/reviewmate
            curl -sfL -H "Authorization: token $GHCR_TOKEN" "$RAW_BASE/deploy/server3-embedding/docker-compose.yml" -o docker-compose.yml.tmp && mv docker-compose.yml.tmp docker-compose.yml
            curl -sfL -H "Authorization: token $GHCR_TOKEN" "$RAW_BASE/deploy/server3-embedding/nginx.conf" -o nginx.conf.tmp && mv nginx.conf.tmp nginx.conf
            curl -sfL -H "Authorization: token $GHCR_TOKEN" "$RAW_BASE/deploy/server3-embedding/init-ssl.sh" -o init-ssl.sh.tmp && mv init-ssl.sh.tmp init-ssl.sh
            chmod +x init-ssl.sh
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            CERT_EXISTS=$(docker run --rm -v reviewmate_certbot_conf:/etc/letsencrypt alpine test -f /etc/letsencrypt/live/embed.reviewmate.live/fullchain.pem && echo "yes" || echo "no")
            if [ "$CERT_EXISTS" = "no" ]; then
              echo "SSL certs not found, running init-ssl.sh..."
              bash init-ssl.sh
            else
              docker compose up -d --remove-orphans
            fi
            docker image prune -f
            echo "Embedding service deployed successfully"

  deploy-scraper:
    needs: [detect-changes, build-scraper]
    if: |
      always() &&
      (needs.build-scraper.result == 'success' || needs.detect-changes.outputs['deploy-scraper'] == 'true') &&
      needs.build-scraper.result != 'failure'
    runs-on: self-hosted
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SCRAPING_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 5m
          envs: RAW_BASE,GHCR_TOKEN
          script: |
            cd /opt/reviewmate
            curl -sfL -H "Authorization: token $GHCR_TOKEN" "$RAW_BASE/deploy/server4-scraper/docker-compose.yml" -o docker-compose.yml.tmp && mv docker-compose.yml.tmp docker-compose.yml
            curl -sfL -H "Authorization: token $GHCR_TOKEN" "$RAW_BASE/deploy/server4-scraper/nginx.conf" -o nginx.conf.tmp && mv nginx.conf.tmp nginx.conf
            curl -sfL -H "Authorization: token $GHCR_TOKEN" "$RAW_BASE/deploy/server4-scraper/init-ssl.sh" -o init-ssl.sh.tmp && mv init-ssl.sh.tmp init-ssl.sh
            chmod +x init-ssl.sh
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            CERT_EXISTS=$(docker run --rm -v reviewmate_certbot_conf:/etc/letsencrypt alpine test -f /etc/letsencrypt/live/scrape.reviewmate.live/fullchain.pem && echo "yes" || echo "no")
            if [ "$CERT_EXISTS" = "no" ]; then
              echo "SSL certs not found, running init-ssl.sh..."
              bash init-ssl.sh
            else
              docker compose up -d --remove-orphans
            fi
            docker image prune -f
            echo "Scraper engine deployed successfully"
